[package]
name = "repo"
version = "2.0.0"
edition = "2024"
[dependencies]
common = { path = "../common" }
database = { path = "../database" }
axum = "~0.8.1"
tokio = { version = "1.45", features = ["full"] }
reqwest = { version = "~0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lapin = "~2.5.0"
futures-util = "0.3"
base64 = "0.22"
tar = "0.4"
tempfile = "3"
log = "0.4"
simple_logger = "5"


sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
chrono = "0.4"
