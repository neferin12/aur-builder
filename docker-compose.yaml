services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    ports:
        - "5672:5672"
        - "15672:15672"
    volumes:
        - rabbitmq-data:/var/lib/rabbitmq/
    env_file:
      - .env
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 36000000"
  server:
    image: ghcr.io/neferin12/aur-builder-server:2
    container_name: 'aur-builder-server'
    build:
        context: .
        dockerfile: Dockerfile
        target: server
    env_file:
      - .env
    environment:
      AB_CONFIG_PATH: /config.yaml
    volumes:
      - ./db:/app/db
      - ./config.yaml:/config.yaml
      - ./server_tmp:/tmp
    depends_on:
      - rabbitmq
    restart: always
  worker:
    image: ghcr.io/neferin12/aur-builder-worker:2
    deploy:
        mode: replicated
        replicas: 2
    build:
        context: .
        dockerfile: Dockerfile
        target: worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AMQP_ADDR: ${AMQP_ADDR}
      RUST_LOG: ${RUST_LOG:-info}
      AB_BUILDER: ${AB_BUILDER:-ghcr.io/neferin12/aur-builder-build-container}
      AB_BUILDER_TAG: ${AB_BUILDER_TAG:-2}
    depends_on:
      - rabbitmq
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./db:/app/db
    restart: always
  web:
    image: ghcr.io/neferin12/aur-builder-web:2
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always
    volumes:
      - ./db:/app/db
  notifier:
    image: ghcr.io/neferin12/aur-builder-notifier:2
    build:
      context: .
      dockerfile: Dockerfile
      target: notifier
    env_file:
      - .env
    restart: always
  garage:
    image: dxflrs/garage:v2.1.0
    restart: always
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
    ports:
      - "3900:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
  repo:
    image: ghcr.io/neferin12/aur-builder-repo:2
    build:
      context: .
      target: repo
    env_file:
      - .env
    environment:
      GNUPGHOME: /run/repo-gnupg
    tmpfs:
      - /run/repo-gnupg:mode=0700
    command: ["/bin/sh", "-c", "cp -a /run/signing-source/. /run/repo-gnupg/ && chmod 700 /run/repo-gnupg && exec repo"]
    ports:
      - "3001:3001"
    volumes:
      - ./db:/app/db
      - ./repo-gnupg:/run/signing-source:ro
    depends_on:
      - rabbitmq
      - garage
    restart: always
volumes:
    rabbitmq-data:
    garage-meta:
    garage-data:
