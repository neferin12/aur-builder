[package]
name = "common"
version = "2.3.1"
edition = "2024"

[dependencies]
sea-orm = { version = "~1.1.4", features = ["sqlx", "sqlx-dep"]}
serde = { version = "1.0.217", features = ["derive"] }
lapin = { version = "~2.5.0", default-features = false, features = ["native-tls"] }
log = "~0.4"
rand = "~0.9.0"
tokio = {version = "1.45", features = ["full"] }
dotenvy = "~0.15"
lazy_static = "1.5.0"
serde_json = "1.0.140"
config = { version = "~0.15.11" }

hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"
