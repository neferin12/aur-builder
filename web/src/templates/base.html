<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111c24">
    <title>{% block title %}Packages{% endblock title %} · AUR Builder</title>
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/style.css">
    <script src="/assets/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">A</span><span>AUR Builder<small>Package workspace</small></span></a>
    <div class="nav-label">Workspace</div>
    <nav aria-label="Main navigation"><a class="nav-link active" href="/" {% if current_page == "packages" %}aria-current="page"{% endif %}><span aria-hidden="true">▦</span> Packages</a></nav>
    <div class="sidebar-footer"><span class="dot"></span> Self-hosted build system<small>Version {{ version }}</small></div>
</aside>
<div class="workspace">
    <header class="topbar"><span>Workspace <span class="separator">/</span> {% block location %}Packages{% endblock location %}</span><span class="topbar-label">AUR / Git sources</span></header>
    <main id="content" tabindex="-1">{% block content %}{% endblock content %}</main>
    <footer class="page-footer">AUR Builder <span>Built for your packages.</span></footer>
</div>
</body>
</html>
