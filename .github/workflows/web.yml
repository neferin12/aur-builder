name: Nuxt web
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aur_web_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRESQL_URL: postgresql://postgres:test@localhost:5432/aur_web_test
      PRISMA_POSTGRESQL_URL: postgresql://postgres:test@localhost:5432/aur_web_test
      PRISMA_SQLITE_URL: file:/tmp/aur-web-schema.db
    steps:
      - uses: actions/checkout@v4
      - name: Check Compose port bindings
        run: |
          printf 'RABBITMQ_DEFAULT_USER=ci-admin\nRABBITMQ_DEFAULT_PASS=ci-only\n' > .env
          python3 scripts/provision_broker.py
          GARAGE_RPC_SECRET=ci-only docker compose config --format json --no-interpolate | python3 scripts/check-compose-security.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p database --example migrate
        env:
          DATABASE_URL: sqlite:/tmp/aur-web-schema.db?mode=rwc
      - run: cargo run -p database --example migrate
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/aur_web_test
      - run: npm ci
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run db:check && npm run typecheck && npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: docker build --target web -t aur-builder-web:test .
      - name: Verify container starts against a migrated database
        run: |
          mkdir -p /tmp/aur-web-container-db
          cp /tmp/aur-web-schema.db /tmp/aur-web-container-db/database.sqlite
          sudo chown -R 10001:10001 /tmp/aur-web-container-db
          docker run -d --name aur-web-smoke -p 3000:3000 -v /tmp/aur-web-container-db:/data -e DATABASE_URL=sqlite:/data/database.sqlite -e AB_WEB_URL=https://builder.example -e AB_OIDC_ISSUER=https://issuer.example -e AB_OIDC_CLIENT_ID=test -e AB_OIDC_CLIENT_SECRET=test -e AB_OIDC_ADMIN_GROUP=admins aur-builder-web:test
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:3000/auth/signed-out; then exit 0; fi
            sleep 1
          done
          docker logs aur-web-smoke
          exit 1
